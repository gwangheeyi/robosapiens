# gwanghee 프로젝트의 ros_gz_bridge 설정.
# rmf_control_ui 가 맵 프로젝트에서 생성했다.
#
# 이름을 양쪽 다 절대 경로로 적는다. 로봇이 여러 대일 때
# 상대 이름을 쓰면 전부 같은 토픽으로 겹친다.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# PK_01 · 핑키 1호 (이동 로봇)
- ros_topic_name: "/pinky_01/odom"
  gz_topic_name: "/pinky_01/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky_01/cmd_vel"
  gz_topic_name: "/pinky_01/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/pinky_01/scan"
  gz_topic_name: "/pinky_01/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky_01/joint_states"
  gz_topic_name: "/pinky_01/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky_01/camera/camera_info"
  gz_topic_name: "/pinky_01/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky_01/camera/image_raw"
  gz_topic_name: "/pinky_01/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky_01/imu_raw"
  gz_topic_name: "/pinky_01/imu_raw"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# OMX-01 · 매니퓰레이터 1호 (설치 로봇)
- ros_topic_name: "/omx_01/joint_states"
  gz_topic_name: "/omx_01/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# OMX-02 · 매니퓰레이터 2호 (설치 로봇)
- ros_topic_name: "/omx_02/joint_states"
  gz_topic_name: "/omx_02/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

